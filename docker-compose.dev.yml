version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: event_booking_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_booking_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - event_booking_network

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: event_booking_api_dev
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/event_booking_dev?schema=public
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - event_booking_network
    command: sh -c "npx prisma migrate dev && npm run dev"

volumes:
  postgres_dev_data:

networks:
  event_booking_network:
    driver: bridge
