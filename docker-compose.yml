version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: event_booking_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - event_booking_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event_booking_api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/event_booking?schema=public
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - event_booking_network
    command: sh -c "npx prisma migrate deploy && npm start"

volumes:
  postgres_data:

networks:
  event_booking_network:
    driver: bridge
